[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "hive-cli"
dynamic = ["version"]
description = "Hive - Multi-agent worktree management CLI"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  # Hard guard: PyPI/TestPyPI reject any upload carrying a "Private ::" classifier.
  # This package is distributed via Git + GitHub Releases, never PyPI.
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [ "cyclopts>=3", "prompt-toolkit>=3", "pydantic>=2", "pydantic-settings>=2", "pyyaml>=6", "rich>=13" ]

[project.scripts]
hive = "hive_cli.app:app"

[dependency-groups]
dev = [
  "pytest>=7",
  "pytest-mock>=3",
  # Three segments on purpose: a two-segment ~=0.16 would only cap at <1.0, and
  # pre-1.0 ruff minors promote lint rules and change formatter style. Keep this
  # minor in lockstep with the ruff-pre-commit `rev` in .pre-commit-config.yaml,
  # or CI's `ruff format --check` drifts from what the hook considers clean.
  "ruff~=0.16.0",
  "pre-commit>=4",
]

[tool.hatch.version]
path = "src/hive_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = [ "src/hive_cli" ]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
  "src/hive_cli/**/*.py",
  "src/hive_cli/**/*.yml",
  "src/hive_cli/**/*.kdl",
]

[tool.ruff]
target-version = "py310"
line-length = 88
lint.select = [ "E", "F", "I", "UP" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
pythonpath = [ "src" ]

[tool.semantic_release]
commit_parser = "conventional"
allow_zero_version = true
tag_format = "v{version}"
version_variables = [
  "src/hive_cli/__init__.py:__version__",
]
commit_message = "chore(release): v{version} [skip ci]"

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = [
  '''Merge pull request.*''',
  '''chore\(deps\):.*''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = false

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = true
dist_glob_patterns = ["dist/*"]
